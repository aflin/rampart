<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini IDE</title>
  <link rel="stylesheet" href="js/lib/xterm.min.css">
  <link rel="stylesheet" href="css/ide.css">
  <script src="js/lib/xterm.min.js"></script>
  <script src="js/lib/xterm-addon-fit.min.js"></script>
  <script type="module" src="js/ide.js"></script>
</head>
<body>

  <!-- LOGIN -->
  <div class="login" id="login" hidden>
    <form class="login-box" id="login-form">
      <div class="login-title">Mini IDE</div>
      <div class="login-sub" id="login-sub"></div>
      <input type="password" id="login-pass" placeholder="Password"
             autocomplete="current-password" required>
      <div class="login-error" id="login-error" role="alert"></div>
      <button type="submit">Sign In</button>
    </form>
  </div>

  <!-- IDE -->
  <div class="app" id="app" hidden>

    <nav class="menubar" id="menubar"></nav>

    <header class="toolbar">
      <div class="tb-group">
        <button class="tb-btn toggle" id="toggle-menu" title="Show/hide menu bar">
          <svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke-width="1.4"/></svg>
        </button>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="btn-run" title="Run the current file with rampart (Ctrl/&#8984;+R)">
          <svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>
        </button>
        <button class="tb-btn" id="btn-stop" title="Stop the running script" disabled>
          <svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg>
        </button>
        <input class="run-args" id="run-args" placeholder="arguments"
               title="Arguments passed to the script when it is run" spellcheck="false">
        <button class="tb-btn" id="btn-bundle" title="Build a single-file bundle of this web server">
          <svg viewBox="0 0 16 16"><path d="M8 1.5l6 3v7l-6 3-6-3v-7z M2 4.5l6 3 6-3 M8 7.5v7" fill="none" stroke-width="1.2"/></svg>
        </button>
      </div>

      <div class="docsearch" id="docsearch">
        <div class="docsearch-box">
          <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke-width="1.4"/><path d="M10.5 10.5l3.5 3.5" stroke-width="1.4"/></svg>
          <input type="search" id="docsearch-input" placeholder="Search the Rampart documentation"
                 spellcheck="false" autocomplete="off">
        </div>
        <div class="docsearch-list" id="docsearch-list" hidden></div>
      </div>
      <button class="tb-btn wide" id="btn-docs" title="Open the documentation in a new tab">
        <svg viewBox="0 0 16 16"><path d="M8 4c-1.5-1.2-3.5-1.5-5.5-1.2v9.5c2-.3 4 0 5.5 1.2 1.5-1.2 3.5-1.5 5.5-1.2V2.8C11.5 2.5 9.5 2.8 8 4zM8 4v9.5" fill="none" stroke-width="1.2"/></svg>
        <span>Open Docs</span>
      </button>

      <div class="tb-group">
        <button class="tb-btn wide" id="btn-shell" title="New terminal (long press/right click for options)">
          <svg viewBox="0 0 16 16"><path d="M2 4l4 4-4 4" fill="none" stroke-width="1.6"/><path d="M8 12h6" stroke-width="1.6"/></svg>
          <span>Terminal</span>
        </button>
        <button class="tb-btn wide" id="btn-repl" title="New interactive rampart session (long press/right click for options)">
          <svg viewBox="0 0 16 16"><path d="M8 1.5l5.5 2v4c0 3.4-2.4 5.9-5.5 7-3.1-1.1-5.5-3.6-5.5-7v-4z" fill="none" stroke-width="1.4"/></svg>
          <span>Rampart</span>
        </button>
        <div class="tb-sep"></div>
        <button class="tb-btn toggle" id="toggle-nav" title="Show/hide navigator">
          <svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke-width="1.2"/><rect x="1.5" y="2.5" width="4.5" height="11" class="fillpart"/></svg>
        </button>
        <button class="tb-btn toggle" id="toggle-debug" title="Show/hide terminal area">
          <svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke-width="1.2"/><rect x="1.5" y="9" width="13" height="4.5" class="fillpart"/></svg>
        </button>
        <button class="tb-btn toggle" id="toggle-insp" title="Show/hide inspector">
          <svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke-width="1.2"/><rect x="10" y="2.5" width="4.5" height="11" class="fillpart"/></svg>
        </button>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="btn-logout" title="Sign out">
          <svg viewBox="0 0 16 16"><path d="M6 2.5H3v11h3M10 5l3 3-3 3M13 8H6" fill="none" stroke-width="1.4"/></svg>
        </button>
      </div>
    </header>

    <div class="workspace" id="workspace">

      <!-- NAVIGATOR -->
      <aside class="navigator" id="navigator">
        <div class="pane-head">
          <span class="pane-title" id="root-name">Files</span>
          <button class="icon-btn" id="nav-newfile" title="New file">
            <svg viewBox="0 0 16 16"><path d="M9 1.5H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5.5z M9 1.5v4h4" fill="none" stroke-width="1.1"/><path d="M8 8v4M6 10h4" stroke-width="1.1"/></svg>
          </button>
          <button class="icon-btn" id="nav-newfolder" title="New folder">
            <svg viewBox="0 0 16 16"><path d="M1.5 4a1 1 0 0 1 1-1h3.5l1.5 1.5h6a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" fill="none" stroke-width="1.1"/><path d="M8 7v4M6 9h4" stroke-width="1.1"/></svg>
          </button>
          <button class="icon-btn toggle" id="nav-hidden" title="Show hidden files">
            <svg viewBox="0 0 16 16"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke-width="1.1"/><circle cx="8" cy="8" r="2"/></svg>
          </button>
          <button class="icon-btn" id="nav-refresh" title="Refresh">
            <svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3" fill="none" stroke-width="1.3"/></svg>
          </button>
        </div>
        <div class="tree" id="tree" tabindex="0"></div>
        <div class="nav-filter">
          <input type="search" id="nav-filter" placeholder="Filter" spellcheck="false">
        </div>
      </aside>
      <div class="splitter vsplit" id="split-nav"></div>

      <!-- EDITOR + DEBUG AREA -->
      <main class="center" id="center">
        <div class="editor-area">
          <div class="tabs" id="tabs"></div>
          <div class="jumpbar">
            <span class="jump-path" id="jump-path"></span>
            <span class="activity-status" id="activity-status"></span>
            <span class="cursor-pos" id="cursor-pos"></span>
          </div>
          <div class="editors" id="editors">
            <div class="welcome" id="welcome">
              <div class="welcome-title">Mini IDE</div>
              <div class="welcome-text">
                Select a file in the navigator to edit it.<br>
                <kbd>Ctrl/&#8984;+S</kbd> saves, <kbd>Ctrl/&#8984;+R</kbd> runs the current
                file with rampart.
              </div>
            </div>
          </div>
        </div>
        <div class="splitter hsplit" id="split-debug"></div>
        <section class="debug" id="debug">
          <div class="debug-bar">
            <div class="term-tabs" id="term-tabs"></div>
            <button class="icon-btn" id="debug-newshell" title="New terminal">
              <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke-width="1.4"/></svg>
            </button>
            <button class="icon-btn" id="debug-clear" title="Clear terminal">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke-width="1.2"/><path d="M4.2 11.8l7.6-7.6" stroke-width="1.2"/></svg>
            </button>
          </div>
          <div class="terms" id="terms">
            <div class="terms-empty" id="terms-empty">No terminals open</div>
          </div>
        </section>
      </main>

      <div class="splitter vsplit" id="split-insp"></div>

      <!-- INSPECTOR -->
      <aside class="inspector" id="inspector">
        <div class="pane-head"><span class="pane-title">Inspector</span></div>
        <div class="insp-body">
          <section class="insp-section">
            <h3>File</h3>
            <dl class="insp-list" id="insp-file"><dt>No file selected</dt></dl>
          </section>
          <section class="insp-section">
            <h3>Editor</h3>
            <label class="insp-row">Theme
              <select id="set-cmtheme"></select>
            </label>
            <label class="insp-row">Font size
              <input type="number" id="set-fontsize" min="9" max="28" step="1">
            </label>
            <label class="insp-row">Indent
              <select id="set-indent">
                <option value="2">2 spaces</option>
                <option value="4">4 spaces</option>
                <option value="8">8 spaces</option>
                <option value="tab">Tab</option>
              </select>
            </label>
            <label class="insp-row check">Wrap lines
              <input type="checkbox" id="set-wrap">
            </label>
            <button class="insp-link" id="show-keys">Keyboard shortcuts</button>
          </section>
        </div>
      </aside>
    </div>
  </div>

  <div class="modal-back" id="modal" hidden>
    <form class="modal" id="modal-form">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <input class="modal-input" id="modal-input" spellcheck="false" autocomplete="off">
      <div class="modal-buttons">
        <button type="button" id="modal-cancel">Cancel</button>
        <button type="submit" id="modal-ok" class="primary">OK</button>
      </div>
    </form>
  </div>

  <div class="ctxmenu" id="ctxmenu" hidden></div>

</body>
</html>
